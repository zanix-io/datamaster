# .github/workflows/ci.yml

name: CI

on:
  # Run on push or PRs to main branch
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  # Also invocable as a reusable workflow (`uses: ./.github/workflows/ci.yml`) — `publish.yml`'s
  # own `ci` job calls into this exact workflow instead of duplicating its steps.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows reading of the repository's contents.

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      memcached:
        image: memcached:1
        ports:
          - 11211:11211

      opensearch:
        image: opensearchproject/opensearch:2
        ports:
          - 9200:9200
        env:
          discovery.type: 'single-node'
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # Unlike SeaweedFS below, this image's default entrypoint runs the server directly with no
      # extra args needed — a plain `services:` block works, same as mongo/redis/opensearch above.
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: 'true'
        options: >-
          --health-cmd="curl -sf http://localhost:7700/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      # Temporarily disabled: @zanix/cli check-cycles has not been published yet.
      # - name: Check for circular-import hazards
      #   run: deno run -A jsr:@zanix/cli check-cycles
