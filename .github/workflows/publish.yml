# .github/workflows/publish.yml

name: Publish

on:
  # Run on push or PRs to main branch
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  # Runs `ci.yml` (the `zanix check-cycles` circular-import-hazard check) as a reusable workflow,
  # same repo, same branch — a same-repo `uses:` job can't also declare `runs-on`/`steps` of its
  # own. `publish` below only starts once every job inside this one has succeeded.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci # blocks `publish` unless every job inside the called `ci.yml` succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows reading of the repository's contents.
      id-token: write # Allows the creation of an ID token for authentication with JSR.

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      memcached:
        image: memcached:1
        ports:
          - 11211:11211

      opensearch:
        image: opensearchproject/opensearch:2
        ports:
          - 9200:9200
        env:
          discovery.type: 'single-node'
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # Unlike SeaweedFS below, this image's default entrypoint runs the server directly with no
      # extra args needed — a plain `services:` block works, same as mongo/redis/opensearch above.
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: 'true'
        options: >-
          --health-cmd="curl -sf http://localhost:7700/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # SeaweedFS isn't started via `services:` like mongo/redis/opensearch above — its image's
      # default CMD is a bare shell with no server args baked in (`docker run chrislusf/seaweedfs
      # server -s3` — the S3 gateway needs those args explicitly), and GitHub Actions `services:`
      # has no field to pass trailing command args to a container, only `image`/`env`/`ports`/
      # `options` (docker-create flags). A plain `docker run` step is the correct mechanism for
      # that; the mongo/redis/opensearch `services:` block above is untouched.
      - name: Start SeaweedFS
        run: docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs server -s3

      - name: Wait for SeaweedFS
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8333/ -o /dev/null || [ $? -eq 22 ]; then
              echo "SeaweedFS S3 gateway is up"
              exit 0
            fi
            sleep 2
          done
          echo "SeaweedFS S3 gateway never became reachable" >&2
          docker logs seaweedfs
          exit 1

      # A fresh SeaweedFS instance starts with no buckets. The functional suite doesn't set
      # S3_BUCKET below, so it falls back to `DEFAULT_BUCKET` ('zanix-objects', see
      # `src/modules/storage/connector.ts`) — create that bucket here or every real S3 call in the
      # test fails with `NoSuchBucket`.
      - name: Create SeaweedFS bucket
        run: curl -sf -X PUT http://localhost:8333/zanix-objects

      - name: Run tests
        env:
          RUN_OPENSEARCH_TESTS: 'true'
          RUN_MEILISEARCH_TESTS: 'true'
          RUN_S3_TESTS: 'true'
          S3_ACCESS_KEY: zanix-ci-test
          S3_SECRET_KEY: zanix-ci-test
        run: deno test --allow-all

      - name: Publish to Deno
        # `needs.ci.result == 'success'` is explicit, not just relying on the default `needs:`
        # skip-on-failure behavior above — that default only holds as long as `publish` keeps its
        # own `if:` unset; an `always()`/similar override on the JOB (e.g. added later to get
        # diagnostics on a failing run) would silently defeat it without this STEP-level check.
        if: success() && needs.ci.result == 'success' && github.event_name == 'push'
        run: deno publish
