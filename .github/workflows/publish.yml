# .github/workflows/publish.yml

name: Publish

on:
  # Run on push or PRs to master
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allows reading of the repository's contents.
      id-token: write # Allows the creation of an ID token for authentication with JSR.

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      opensearch:
        image: opensearchproject/opensearch:2
        ports:
          - 9200:9200
        env:
          discovery.type: 'single-node'
          DISABLE_SECURITY_PLUGIN: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # SeaweedFS isn't started via `services:` like mongo/redis/opensearch above — its image's
      # default CMD is a bare shell with no server args baked in (`docker run chrislusf/seaweedfs
      # server -s3` — the S3 gateway needs those args explicitly), and GitHub Actions `services:`
      # has no field to pass trailing command args to a container, only `image`/`env`/`ports`/
      # `options` (docker-create flags). A plain `docker run` step is the correct mechanism for
      # that; the mongo/redis/opensearch `services:` block above is untouched.
      - name: Start SeaweedFS
        run: docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs server -s3

      - name: Wait for SeaweedFS
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8333/ -o /dev/null || [ $? -eq 22 ]; then
              echo "SeaweedFS S3 gateway is up"
              exit 0
            fi
            sleep 2
          done
          echo "SeaweedFS S3 gateway never became reachable" >&2
          docker logs seaweedfs
          exit 1

      - name: Run tests
        env:
          RUN_OPENSEARCH_TESTS: 'true'
          RUN_SEAWEEDFS_TESTS: 'true'
          SEAWEEDFS_ACCESS_KEY: zanix-ci-test
          SEAWEEDFS_SECRET_KEY: zanix-ci-test
        run: deno test --allow-all

      - name: Publish to Deno
        run: deno publish
